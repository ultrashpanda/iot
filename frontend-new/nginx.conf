server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / { add_header Cache-Control "no-store"; try_files $uri $uri/ =404; }
  location ~* \.(css|js|geojson|png|svg)$ { add_header Cache-Control "no-store"; }
}
